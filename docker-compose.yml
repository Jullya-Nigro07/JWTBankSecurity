services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: my_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admadm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  api:
    #roda o Dockerfile
    build: .
    ports:
      - "8080:8080"
    environment:
      BD_HOST: localhost
      BD_PORT: 5432
      BD_NAME: my_users
      BD_USER: postgres
      BD_PASSWORD: admadm
    depends_on:
      db:
        condition: service_healthy
